<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MECIPT-1 — pupitrul de comandă</title>
<meta name="description" content="Emulatorul MECIPT-1, primul calculator construit într-o universitate din România (Timișoara, 1961): pupitrul de comandă, banda perforată, mașina de scris și programele din 1962, cu proveniența fiecărui cuvânt.">
<meta property="og:title" content="MECIPT-1 — pupitrul de comandă">
<meta property="og:description" content="Emulatorul MECIPT-1, primul calculator construit într-o universitate din România (Timișoara, 1961): pupitrul de comandă, banda perforată, mașina de scris și programele din 1962, cu proveniența fiecărui cuvânt.">
<meta property="og:type" content="website">
<meta property="og:image" content="img/mecipt-1.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/console.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body class="console-page">
<noscript><p class="noscript">Emulatorul are nevoie de JavaScript. / The emulator needs JavaScript.</p></noscript>

<header class="topbar" id="topbar">
  <div class="brand">
    <h1 id="title">MECIPT-1</h1>
    <p id="subtitle"></p>
  </div>

  <div class="pop-wrap prog-wrap">
    <button class="prog" id="program-card" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="program-sheet">
      <span><b id="program-title"></b><span class="prog-sum" id="program-sum"></span></span>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
    </button>
    <div class="sheet-pop" id="program-sheet" role="dialog" aria-labelledby="program-label" hidden>
      <h2 id="program-label">Programul</h2>
      <select id="program"></select>
      <p id="provenance" class="provenance"></p>
    </div>
  </div>

  <div class="bar-inline" id="bar-inline">
    <div class="seg" id="mode" role="group" aria-labelledby="mode-label"><span id="mode-label" class="visually-hidden">Vederea</span><button id="mode-console" type="button" aria-pressed="true">Pupitru</button><button id="mode-atelier" type="button" aria-pressed="false">Atelier</button><button id="mode-both" type="button" aria-pressed="false">Ambele</button></div>
    <fieldset class="seg speed" id="speed">
      <legend id="speed-label">Viteza</legend>
      <label><input type="radio" name="speed" value="epoca" checked> <span id="speed-epoca">1962</span></label>
      <label><input type="radio" name="speed" value="rapid"> <span id="speed-rapid">×100</span></label>
    </fieldset>
  </div>

  <div class="spacer"></div>

  <button class="ico" id="step" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14l10-7zM18 5v14"></path></svg></button>
  <button class="go" id="run" type="button">
    <svg class="i i-run" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg>
    <svg class="i i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg>
    <span class="go-label" id="run-label"></span>
  </button>

  <div class="sep" id="bar-sep"></div>

  <div class="bar-learn" id="bar-learn">
    <button class="txt" id="tour-start" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg><span class="btn-label"></span></button>
    <button class="ico" id="explain" type="button" aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9.4a2.5 2.5 0 1 1 3.7 2.2c-.8.5-1.3 1-1.3 1.9M12 17h.01"></path></svg><span class="btn-label visually-hidden"></span></button>
    <a class="txt doc-link" id="doc-link" href="doc.html" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"></path><path d="M14 3v4h4"></path><path d="M9.5 13h5M9.5 16.5h3.5"></path></svg><span class="btn-label"></span></a>
    <button class="txt" id="view-3d" type="button" aria-pressed="false" data-help="view3d">3D</button>
    <button class="ico sound" id="sound" type="button" aria-pressed="true" data-help="sound"><span aria-hidden="true">🔊</span></button>
    <div class="seg" id="lang" role="group" aria-labelledby="lang-label"><span id="lang-label" class="visually-hidden">Limba</span><button id="lang-ro" type="button" lang="ro" aria-pressed="true">RO</button><button id="lang-en" type="button" lang="en" aria-pressed="false">EN</button></div>
  </div>

  <div class="bar-extra" id="bar-extra">
    <label class="view-pick" for="view"><span id="view-label" class="visually-hidden">Vedere</span>
      <select id="view">
        <option value="all">tot pupitrul</option><option value="left">panoul stâng</option>
        <option value="middle">panoul din mijloc</option><option value="right">panoul drept</option>
      </select></label>
    <button class="ico" id="reload" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-.9 4M20 5v6h-6"></path></svg><span class="btn-label visually-hidden"></span></button>
  </div>

  <div class="pop-wrap more-wrap">
    <button class="ico" id="more" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="more-menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h.01M12 12h.01M18 12h.01"></path></svg></button>
    <div class="sheet-pop" id="more-menu" role="dialog" aria-labelledby="more-label" hidden>
      <h2 id="more-label">Mai multe</h2>
      <div class="more-slot" id="more-slot"></div>
    </div>
  </div>

  <div class="trace" aria-hidden="true"><i></i></div>
</header>

<p id="explain-banner" class="explain-banner" hidden></p>

<main class="room">
  <div class="desk" id="desk" data-zone="all">
    <div id="desk-3d" class="desk-3d" hidden><div id="zones3d" class="zones3d" role="group"></div><p id="desk-3d-msg" class="desk-3d-msg"></p></div>
    <div class="frame" id="stage">
      <div class="floor" aria-hidden="true"></div>
      <div class="scene">
        <div class="camera" id="camera">
          <div class="shadow" aria-hidden="true"></div>
          <div class="panels" id="panels" data-view="all">
            <div class="wing" id="wing-left"><div class="face"><div class="panel-slot" id="panel-left"></div></div><div class="shelf" aria-hidden="true"></div></div>
            <div class="wing" id="wing-middle"><div class="face"><div class="panel-slot" id="panel-middle"></div></div><div class="shelf" aria-hidden="true"></div></div>
            <div class="wing" id="wing-right"><div class="face"><div class="panel-slot" id="panel-right"></div></div><div class="shelf" aria-hidden="true"></div></div>
          </div>
        </div>
      </div>
      <div class="mini" id="mini" aria-hidden="true" hidden><span class="a"></span><span class="b"></span><span class="c"></span><i></i></div>
      <div class="pager" id="pager" hidden>
        <button class="ico" id="page-prev" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg></button>
        <span id="page-label"></span>
        <button class="ico" id="page-next" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"></path></svg></button>
      </div>
      <div class="stage-cap">
        <p class="state" id="statebar"><b><span class="dot" aria-hidden="true"></span><span id="status" class="status" aria-live="polite"></span> <span id="machine-time" class="machine-time"></span></b><span class="hint" id="hint"></span></p>
        <div class="nowbar" id="nowbar" hidden>
          <button class="open" id="nowbar-open" type="button"><i aria-hidden="true"></i><span><span class="mono" id="nowbar-text"></span></span></button>
          <button class="ico" id="nowbar-run" type="button"><svg class="i i-run" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg><svg class="i i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"></path></svg></button>
        </div>
        <div class="zones" id="zones" role="group"></div>
      </div>
    </div>
  </div>

  <section id="live" class="live" aria-labelledby="live-title">
    <h2 id="live-title" class="visually-hidden">Live</h2>
    <div class="live-row">
      <div class="seg" id="live-mode" role="group" aria-labelledby="live-mode-label"><span id="live-mode-label" class="visually-hidden"></span><button id="live-decoded" type="button" aria-pressed="true"></button><button id="live-lamps" type="button" aria-pressed="false"></button></div>
    </div>
    <button class="strip" id="live-strip" type="button">
      <span class="strip-pan" id="live-strip-pan" aria-hidden="true"></span>
      <span class="strip-hint" aria-hidden="true"><span id="live-strip-label"></span><svg class="i" style="width:14px;height:14px" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"></path></svg></span>
    </button>
    <section class="live-card" id="live-card" aria-label="Registre">
      <div class="reg">
        <div class="reg-head"><span class="reg-lab" id="live-rai-lab"></span><span class="reg-val mono" id="live-rai"></span></div>
        <div class="dots" id="live-rai-dots" aria-hidden="true"></div>
      </div>
      <div class="reg">
        <div class="reg-head"><span class="reg-lab" id="live-ri-lab"></span></div>
        <div class="halves">
          <div class="half" id="live-half-1"><small id="live-half-1-lab"></small><span class="mono" id="live-half-1-val"></span></div>
          <div class="half" id="live-half-2"><small id="live-half-2-lab"></small><span class="mono" id="live-half-2-val"></span></div>
        </div>
        <div class="dots" id="live-ri-dots" aria-hidden="true"></div>
        <p class="reg-cap" id="live-ri-cap"></p>
      </div>
      <div class="reg">
        <div class="reg-head"><span class="reg-lab" id="live-m-lab"></span><span class="reg-val small mono" id="live-m"></span></div>
        <div class="dots" id="live-m-dots" aria-hidden="true"></div>
        <p class="reg-cap" id="live-m-cap"></p>
      </div>
      <div class="reg">
        <div class="reg-lab" id="live-uop-lab"></div>
        <p class="uop"><i aria-hidden="true"></i><span id="live-uop"></span></p>
        <p class="reg-cap" id="live-uop-gloss"></p>
      </div>
    </section>
    <button class="peek" id="live-peek" type="button">
      <span class="peek-head"><h2 id="live-peek-title"></h2><span class="chip" id="live-peek-chip"></span></span>
      <span class="paper" id="live-peek-paper"></span>
    </button>
  </section>

  <section id="atelier" class="atelier" aria-label="Atelier">
    <div class="at-controls">
      <button id="at-reset" type="button" data-help="atelier-controls">Reset</button>
      <button id="at-step" type="button" data-help="atelier-controls">Pas</button>
      <button id="at-run" type="button" data-help="atelier-controls">Rulează</button>
      <button id="at-stop" type="button" data-help="atelier-controls">Oprește</button>
      <label><span id="at-start-label">Pornire de la (octal)</span> <input id="at-start" size="5" maxlength="4" inputmode="numeric"></label>
      <p id="at-modified" class="at-modified" hidden><span id="at-modified-text"></span> <button id="at-revert-link" type="button"></button></p>
    </div>
    <div class="at-tools">
      <div id="at-editor" class="at-tool at-editor"></div>
      <div id="at-drum" class="at-tool at-drum" data-help="atelier-drum"></div>
      <div id="at-punch" class="at-tool at-punch"></div>
    </div>
  </section>

  <div class="peripherals">
    <section class="device typewriter" id="dev-typewriter">
      <h2 class="dev-head"><button class="dev-toggle" id="toggle-typewriter" type="button" aria-expanded="false" aria-controls="body-typewriter"><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg><span class="dev-title" id="typewriter-label">Mașina de scris</span><span class="dev-mark" id="typewriter-mark"></span></button></h2>
      <div class="dev-body" id="body-typewriter" hidden>
        <div id="sheet" class="sheet"></div>
        <button class="copy" id="copy-listing" type="button"><svg class="i" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg><span id="copy-listing-label"></span></button>
      </div>
    </section>
    <section class="device drum-device" id="dev-drum">
      <h2 class="dev-head"><button class="dev-toggle" id="toggle-drum" type="button" aria-expanded="false" aria-controls="body-drum"><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg><span class="dev-title" id="drum-label">Tamburul magnetic</span><span class="dev-mark" id="drum-mark"></span></button></h2>
      <div class="dev-body" id="body-drum" hidden>
        <div class="drum-pair">
          <div id="drum" class="mag-drum"></div>
          <figure class="drum-map-fig" id="drum-map-fig">
            <canvas id="drum-map" class="drum-map" width="320" height="320" role="img"></canvas>
            <figcaption id="drum-map-legend" class="drum-map-legend" aria-live="off"></figcaption>
          </figure>
        </div>
        <p id="drum-info" class="device-note"></p>
      </div>
    </section>
    <section class="device reader" id="dev-reader">
      <h2 class="dev-head"><button class="dev-toggle" id="toggle-reader" type="button" aria-expanded="false" aria-controls="body-reader"><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg><span class="dev-title" id="reader-label">Cititorul de bandă perforată</span><span class="dev-mark" id="reader-mark"></span></button></h2>
      <div class="dev-body" id="body-reader" hidden>
        <div id="tape" class="tape"></div>
        <p id="tape-info" class="device-note"></p>
      </div>
    </section>
  </div>

  <section id="learn" class="learn" aria-labelledby="learn-title">
    <div class="learn-card">
      <h2 id="learn-title"></h2>
      <p id="learn-note"></p>
      <div class="learn-list">
        <button id="learn-tour" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg><span></span></button>
        <button id="learn-explain" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.6 9.4a2.5 2.5 0 1 1 3.7 2.2c-.8.5-1.3 1-1.3 1.9M12 17h.01"></path></svg><span></span></button>
        <a id="learn-doc" href="doc.html" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7z"></path><path d="M14 3v4h4"></path><path d="M9.5 13h5M9.5 16.5h3.5"></path></svg><span></span></a>
      </div>
    </div>
  </section>
</main>

<section id="tour-card" class="tour-card" role="dialog" aria-labelledby="tour-count" tabindex="-1" hidden>
  <p id="tour-count" class="tour-count"></p>
  <p id="tour-text" class="tour-text" aria-live="polite"></p>
  <p id="tour-wait" class="tour-wait" hidden></p>
  <div class="tour-buttons"><button id="tour-prev" type="button">Înapoi</button><button id="tour-next" type="button">Înainte</button><button id="tour-close" type="button">Închide turul</button></div>
</section>
<aside id="help-panel" class="help-panel" role="dialog" aria-labelledby="help-title" hidden>
  <button id="help-close" type="button" class="help-close">Închide</button>
  <h2 id="help-title" tabindex="-1"></h2>
  <p id="help-status" class="help-status"></p>
  <p id="help-short" class="help-short"></p>
  <p id="help-value" class="help-value" hidden></p>
  <button id="help-more-btn" type="button" aria-expanded="false" aria-controls="help-more">Mai multe detalii</button>
  <div id="help-more" class="help-more" hidden></div>
</aside>
<nav id="phone-tabs" class="phone-tabs">
  <button id="tab-desk" type="button" data-target="desk"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"></rect><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"></path></svg><span></span></button>
  <button id="tab-live" type="button" data-target="live"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"></path></svg><span></span></button>
  <button id="tab-typewriter" type="button" data-target="dev-typewriter"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6M5 9h14v8H5zM8 14h8v7H8z"></path></svg><span></span></button>
  <button id="tab-atelier" type="button" data-target="atelier"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"></path></svg><span></span></button>
  <button id="tab-learn" type="button" data-target="learn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 21H20v-3"></path></svg><span></span></button>
</nav>
<footer class="credits"><p id="attribution"></p></footer>

</body>
