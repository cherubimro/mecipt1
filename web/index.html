<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MECIPT-1 — pupitrul de comandă</title>
<meta name="description" content="Emulatorul MECIPT-1, primul calculator construit într-o universitate din România (Timișoara, 1961): pupitrul de comandă, banda perforată, mașina de scris și programele din 1962, cu proveniența fiecărui cuvânt.">
<meta property="og:title" content="MECIPT-1 — pupitrul de comandă">
<meta property="og:description" content="Emulatorul MECIPT-1, primul calculator construit într-o universitate din România (Timișoara, 1961): pupitrul de comandă, banda perforată, mașina de scris și programele din 1962, cu proveniența fiecărui cuvânt.">
<meta property="og:type" content="website">
<meta property="og:image" content="img/mecipt-1.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/console.css">
</head>
<body>
<noscript><p class="noscript">Emulatorul are nevoie de JavaScript. / The emulator needs JavaScript.</p></noscript>
<header class="bar">
  <div class="bar-title">
    <h1 id="title">MECIPT-1 — pupitrul de comandă</h1>
    <p id="subtitle"></p>
  </div>
  <div class="bar-program">
    <label for="program" id="program-label">Programul</label>
    <select id="program"></select>
    <p id="provenance" class="provenance"></p>
  </div>
  <div class="bar-controls">
    <div class="mode" id="mode" role="group" aria-labelledby="mode-label"><span id="mode-label" class="visually-hidden">Vederea</span>
      <button id="mode-console" type="button" aria-pressed="true">Pupitru</button><button id="mode-atelier" type="button" aria-pressed="false">Atelier</button><button id="mode-both" type="button" aria-pressed="false">Ambele</button></div>
    <fieldset class="speed">
      <legend id="speed-label">Viteza</legend>
      <label><input type="radio" name="speed" value="epoca" checked> <span id="speed-epoca">ca în 1962</span></label>
      <label><input type="radio" name="speed" value="rapid"> <span id="speed-rapid">rapid</span></label>
    </fieldset>
    <label class="view"><span id="view-label">Vedere</span>
      <select id="view">
        <option value="all">tot pupitrul</option><option value="left">panoul stâng</option>
        <option value="middle">panoul din mijloc</option><option value="right">panoul drept</option>
      </select></label>
    <button id="view-3d" type="button" aria-pressed="false" data-help="view3d">3D</button>
    <button id="tour-start" type="button">Tur ghidat</button>
    <button id="explain" type="button" aria-pressed="false">Explică</button>
    <a id="doc-link" class="doc-link" href="doc.html" target="_blank" rel="noopener">Documentație</a>
    <button id="reload" type="button">Reîncarcă</button>
    <button id="sound" class="sound" type="button" aria-pressed="true" data-help="sound"><span aria-hidden="true">🔊</span></button>
    <div class="lang" role="group" aria-labelledby="lang-label"><span id="lang-label" class="visually-hidden">Limba</span>
      <button id="lang-ro" type="button" lang="ro" aria-pressed="true">RO</button><button id="lang-en" type="button" lang="en" aria-pressed="false">EN</button></div>
  </div>
</header>
<p class="hint"><span id="hint"></span></p>
<p id="explain-banner" class="explain-banner" hidden></p>
<p class="state"><span id="status" class="status" aria-live="polite"></span> <span id="machine-time" class="machine-time"></span></p>

<main class="room">
  <div class="desk" id="desk">
    <div id="desk-3d" class="desk-3d" hidden><div id="zones3d" class="zones3d" role="group"></div><p id="desk-3d-msg" class="desk-3d-msg"></p></div>
    <div class="frame">
      <div class="panels" id="panels" data-view="all">
        <div class="panel-slot" id="panel-left"></div>
        <div class="panel-slot" id="panel-middle"></div>
        <div class="panel-slot" id="panel-right"></div>
      </div>
    </div>
  </div>
  <section id="atelier" class="atelier" aria-label="Atelier">
    <div class="at-controls">
      <button id="at-reset" type="button" data-help="atelier-controls">Reset</button>
      <button id="at-step" type="button" data-help="atelier-controls">Pas</button>
      <button id="at-run" type="button" data-help="atelier-controls">Rulează</button>
      <button id="at-stop" type="button" data-help="atelier-controls">Oprește</button>
      <label><span id="at-start-label">Pornire de la (octal)</span> <input id="at-start" size="5" maxlength="4" inputmode="numeric"></label>
      <p id="at-modified" class="at-modified" hidden><span id="at-modified-text"></span> <button id="at-revert-link" type="button"></button></p>
    </div>
    <div class="at-tools">
      <div id="at-editor" class="at-tool at-editor"></div>
      <div id="at-drum" class="at-tool at-drum" data-help="atelier-drum"></div>
      <div id="at-punch" class="at-tool at-punch"></div>
    </div>
  </section>
  <div class="peripherals">
    <section class="device drum-device" id="dev-drum">
      <h2 id="drum-label">Tamburul magnetic</h2>
      <div class="drum-pair">
        <div id="drum" class="mag-drum"></div>
        <figure class="drum-map-fig" id="drum-map-fig">
          <canvas id="drum-map" class="drum-map" width="320" height="320" role="img"></canvas>
          <figcaption id="drum-map-legend" class="drum-map-legend" aria-live="off"></figcaption>
        </figure>
      </div>
      <p id="drum-info" class="device-note"></p>
    </section>
    <section class="device reader" id="dev-reader">
      <h2 id="reader-label">Cititorul de bandă perforată</h2>
      <div id="tape" class="tape"></div>
      <p id="tape-info" class="device-note"></p>
    </section>
    <section class="device typewriter" id="dev-typewriter">
      <h2 id="typewriter-label">Mașina de scris</h2>
      <div id="sheet" class="sheet"></div>
    </section>
  </div>
</main>
<section id="tour-card" class="tour-card" role="dialog" aria-labelledby="tour-count" tabindex="-1" hidden>
  <p id="tour-count" class="tour-count"></p>
  <p id="tour-text" class="tour-text" aria-live="polite"></p>
  <p id="tour-wait" class="tour-wait" hidden></p>
  <div class="tour-buttons"><button id="tour-prev" type="button">Înapoi</button><button id="tour-next" type="button">Înainte</button><button id="tour-close" type="button">Închide turul</button></div>
</section>
<aside id="help-panel" class="help-panel" role="dialog" aria-labelledby="help-title" hidden>
  <button id="help-close" type="button" class="help-close">Închide</button>
  <h2 id="help-title" tabindex="-1"></h2>
  <p id="help-status" class="help-status"></p>
  <p id="help-short" class="help-short"></p>
  <p id="help-value" class="help-value" hidden></p>
  <button id="help-more-btn" type="button" aria-expanded="false" aria-controls="help-more">Mai multe detalii</button>
  <div id="help-more" class="help-more" hidden></div>
</aside>
<nav id="phone-tabs" class="phone-tabs">
  <button id="tab-desk" type="button" data-target="desk"></button>
  <button id="tab-typewriter" type="button" data-target="dev-typewriter"></button>
  <button id="tab-reader" type="button" data-target="dev-reader"></button>
  <button id="tab-drum" type="button" data-target="dev-drum"></button>
  <button id="tab-atelier" type="button" data-target="atelier"></button>
</nav>
<footer class="credits"><p id="attribution"></p></footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
