<!-- Scenariul de fum al pupitrului: rulat de tests/web-smoke.sh în Chrome fără ecran. -->
<html lang="ro">
<meta charset="utf-8">
<title>smoke</title>
<p id="result">SMOKE RUNNING</p>
<iframe id="f" src="../index.html" width="1600" height="1000"></iframe>
<script type="module">
const out = document.getElementById('result');
const stage = (name) => { out.textContent = 'SMOKE RUNNING: ' + name; };
const fail = (why) => { out.textContent = 'SMOKE FAIL: ' + why; throw new Error(why); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
// rAF nu rulează sub timpul virtual al Chrome: cadrele paginii se avansează explicit, câte 50 ms.
let P = null;
async function until(cond, ms, why) {
  for (let t = 0; t < ms; t += 50) { if (cond()) return; if (P && P.advance) P.advance(50); await sleep(50); }
  fail(typeof why === 'function' ? why() : why);
}
const f = document.getElementById('f');
const errors = [];
f.addEventListener('load', () => {
  f.contentWindow.addEventListener('error', (e) => errors.push(String(e.message)));
  f.contentWindow.addEventListener('unhandledrejection', (e) => errors.push(String(e.reason)));
});
(async () => {
  await until(() => f.contentWindow && f.contentWindow.__pupitru, 10000, 'pagina nu expune __pupitru');
  const w = f.contentWindow, d = f.contentDocument;
  P = w.__pupitru;
  await P.ready;
  const lamps = d.querySelectorAll('.lamp').length, sw = d.querySelectorAll('.switch').length;
  if (lamps !== 161 || sw !== 63) fail(`becuri ${lamps} (161), comutatoare ${sw} (63)`);
  const prov = d.getElementById('provenance').textContent;
  if (!prov.includes('ORIGINAL') || !prov.includes('39')) fail('eticheta de proveniență: ' + prov);
  const glow = (id) => parseFloat(d.querySelector('#' + id + ' .glow').style.opacity || '0');
  const click = (id) => d.getElementById(id).dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
  stage('accesibilitate');
  // accesibilitate: nume pentru fiecare comutator, starea celor cu reținere, inel de focus vizibil
  const unnamed = [...d.querySelectorAll('.switch')].filter((s) => !(s.getAttribute('aria-label') || '').trim());
  if (unnamed.length) fail('comutatoare fără nume: ' + unnamed.slice(0, 3).map((s) => s.id).join(', '));
  for (const id of ['switch-M-0', 'switch-RAI-0', 'switch-pulses-0'])
    if (!d.getElementById(id).hasAttribute('aria-pressed')) fail('fără aria-pressed: ' + id);
  if (d.getElementById('switch-RAI-0').getAttribute('aria-pressed') !== 'true') fail('RAI 0 ar trebui ridicat la 1477');
  const ring = d.querySelector('#switch-compute-0 .focus-ring');
  if (w.getComputedStyle(ring).vectorEffect !== 'non-scaling-stroke') fail('inelul de focus se scalează cu panoul');
  const status = d.getElementById('status');
  if (status.getAttribute('aria-live') !== 'polite' || !d.getElementById('machine-time')) fail('timpul de mașină trebuie scos din zona anunțată');
  await until(() => d.getElementById('machine-time').textContent.includes('s'), 2000, 'timpul de mașină lipsește');
  if (/\d/.test(status.textContent)) fail('starea anunțată conține timpul: ' + status.textContent);
  // indiciul vizibil pe butonul din îndrumare și mărirea unui panou
  if (!d.getElementById('switch-compute-0').classList.contains('cue')) fail('AUTOMAT nu e marcat de îndrumare');
  // săgeata care pulsează spre CALCULEAZA AUTOMAT: se vede de departe (pe tot pupitrul, panoul e micșorat)
  const arrow = d.getElementById('cue-arrow');
  if (!arrow || arrow.getAttribute('display') === 'none') fail('lipsește săgeata spre CALCULEAZA');
  else {
    const ab = arrow.getBoundingClientRect(), sb = d.getElementById('switch-compute-0').getBoundingClientRect();
    if (ab.height < 30) fail('săgeata e prea mică: ' + ab.height.toFixed(0) + ' px');
    if (Math.abs((ab.left + ab.right) / 2 - (sb.left + sb.right) / 2) > sb.width) fail('săgeata nu arată spre comutator');
    if (ab.top < sb.bottom - 2) fail('săgeata acoperă comutatorul');
    if (!arrow.textContent.includes('Apăsați aici')) fail('săgeata fără „Apăsați aici”: ' + arrow.textContent);
  }
  P.setView('right');
  const wR = d.getElementById('switch-compute-0').getBoundingClientRect().width;
  if (wR < 24) fail('panoul drept mărit: comutatorul are ' + wR.toFixed(1) + ' px');
  P.setView('all');
  stage('explicatii');
  // explicațiile: modul Explică nu acționează comutatoarele; valoarea se actualizează; limba se schimbă pe loc
  const helpRO = await (await fetch('../data/help/ro.json')).json();
  const helpEN = await (await fetch('../data/help/en.json')).json();
  const panel = d.getElementById('help-panel');
  const shown = () => !panel.hidden && w.getComputedStyle(panel).display !== 'none';
  const rai9 = d.getElementById('switch-RAI-9');
  const pressed0 = rai9.getAttribute('aria-pressed');
  P.explainMode(true);
  click('switch-RAI-9');
  if (!shown() || !d.getElementById('help-title').textContent.includes('RAI')) fail('Explică pe RAI 9: ' + d.getElementById('help-title').textContent);
  if (rai9.getAttribute('aria-pressed') !== pressed0) fail('în modul Explică comutatorul s-a mișcat');
  const pr = panel.getBoundingClientRect(), ra9 = d.getElementById('lamp-RA-9');
  if (ra9.getBoundingClientRect().right > pr.left) fail('panoul de explicații acoperă pupitrul');
  if (!d.getElementById('explain-banner') || d.getElementById('explain-banner').hidden) fail('rândul „Mod explicații” lipsește');
  d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  if (d.getElementById('explain').getAttribute('aria-pressed') !== 'false') fail('Esc nu iese din modul Explică');
  click('switch-RAI-9');                  // acum chiar mută bitul: 1477 → 1476
  P.explain('switch-RAI-9');
  P.advance(50);
  const val = d.getElementById('help-value').textContent;
  if (!val.includes('1476') || !val.includes('830')) fail('valoarea RAI: ' + val);
  click('lamp-uop-19');                   // celula ⎍ rândul 2, coloana 1 = microoperația 16
  if (d.getElementById('help-title').textContent !== helpRO.entries['lamp-uop'].title) fail('becul de microoperație: ' + d.getElementById('help-title').textContent);
  if (!d.getElementById('help-value').textContent.includes('(ra)/2 trece în RA')) fail('numele microoperației: ' + d.getElementById('help-value').textContent);
  P.setLang('en');
  P.advance(50);
  if (d.getElementById('help-title').textContent !== helpEN.entries['lamp-uop'].title) fail('explicația în engleză: ' + d.getElementById('help-title').textContent);
  if (!d.getElementById('help-value').textContent.includes('(ra)/2 goes into RA')) fail('valoarea în engleză: ' + d.getElementById('help-value').textContent);
  P.setLang('ro');
  click('switch-RAI-9');                  // înapoi la 1477
  P.closeHelp();
  if (shown()) fail('panoul de explicații nu se închide');
  stage('tur');
  // turul ghidat: pornește, marchează ținta, supraviețuiește schimbării programului, așteaptă textul pe coală
  const card = d.getElementById('tour-card');
  const viewBeforeTour = d.getElementById('panels').dataset.view;
  d.getElementById('tour-start').focus();
  d.getElementById('tour-start').click();
  P.advance(50);
  if (!card.contains(d.activeElement)) fail('focusul nu intră în cardul turului: ' + (d.activeElement && d.activeElement.id));
  if (d.getElementById('tour-text').getAttribute('aria-live') !== 'polite') fail('textul turului nu e anunțat');
  if (card.hidden || !d.getElementById('desk').classList.contains('tour-target')) fail('turul: cardul sau ținta primului pas');
  // fiecare pas încadrează grupul despre care vorbește, ca „Înainte” să se vadă pe pupitru
  const frameBox = () => { const f = d.querySelector('.tour-frame'); if (!f) return null; const b = f.getBoundingClientRect(); return `${Math.round(b.x)},${Math.round(b.y)},${Math.round(b.width)},${Math.round(b.height)}`; };
  d.getElementById('tour-next').click(); P.advance(50);
  const fM = frameBox();
  if (!fM) fail('turul: pasul despre panoul din mijloc nu încadrează aparatele');
  const nM = d.querySelectorAll('.tour-frame').length;
  if (nM !== 1) fail('turul: un singur chenar pe pas, sunt ' + nM);
  d.getElementById('tour-next').click(); P.advance(50);
  const fRI = frameBox();
  if (!fRI || fRI === fM) fail('turul: chenarul nu se mută de la aparate la M: ' + fM + ' / ' + fRI);
  d.getElementById('tour-prev').click(); d.getElementById('tour-prev').click(); P.advance(50);
  while (P.tour.step() && P.tour.step().id !== 'start-address') { d.getElementById('tour-next').click(); P.advance(50); }
  if (!d.getElementById('tour-next').disabled) fail('turul: Înainte trebuie blocat cât se încarcă programul pasului');
  await until(() => !d.getElementById('tour-next').disabled, 5000, 'turul: încărcarea programului nu se termină');
  d.getElementById('tour-next').click(); P.advance(50);
  if (!d.getElementById('switch-compute-0').classList.contains('tour-target')) fail('turul: ținta pasului run');
  if (d.getElementById('tour-next').disabled) fail('turul: la pasul run, Înainte trebuie să poată sări peste el');
  // vizitatorul alege alt program la pasul run: mașina se oprește fără să scrie; turul spune ce e de făcut
  await P.select('inex1');
  if (!P.tour.active || P.tour.step().id !== 'run') fail('turul s-a pierdut la schimbarea programului');
  P.setSpeed('rapid');            // banda INEX-1 reconstruită ține ~3 min la viteza din 1962
  click('switch-compute-0');
  await until(() => d.getElementById('tour-wait').textContent.includes(helpRO.tour[4].id === 'start-address' ? 'Înapoi' : 'Înapoi'), 10000,
    () => 'turul blocat după INEX: ' + d.getElementById('tour-wait').textContent);
  P.setSpeed('epoca');
  d.getElementById('tour-prev').click(); P.advance(50);
  if (P.tour.step().id !== 'start-address') fail('Înapoi la start-address');
  await until(() => !d.getElementById('tour-next').disabled, 5000, 'start-address nu reîncarcă retipărirea');
  if (d.getElementById('program').value !== 'retiparire-1962') fail('start-address nu a reîncărcat retipărirea');
  d.getElementById('tour-next').click(); P.advance(50);
  click('switch-compute-0');
  await until(() => P.tour.step() && P.tour.step().id === 'typewriter', 10000, () => 'turul nu trece mai departe: ' + (P.tour.step() || {}).id);
  P.setLang('en');
  const iTw = helpEN.tour.findIndex((s) => s.id === 'typewriter');
  if (!d.getElementById('tour-text').textContent.startsWith(helpEN.tour[iTw].text.slice(0, 30))) fail('turul în engleză: ' + d.getElementById('tour-text').textContent);
  if (!d.getElementById('tour-count').textContent.includes(`${iTw + 1} / ${helpEN.tour.length}`)) fail('numărul pasului: ' + d.getElementById('tour-count').textContent);
  P.setLang('ro');
  d.getElementById('tour-close').click();
  if (!card.hidden || d.querySelector('.tour-target')) fail('turul nu se închide curat');
  if (d.activeElement !== d.getElementById('tour-start')) fail('focusul nu revine la „Tur ghidat”');
  if (d.querySelector('.tour-frame')) fail('chenarul turului rămâne după închidere');
  if (d.getElementById('panels').dataset.view !== viewBeforeTour) fail('vederea nu revine după tur: ' + d.getElementById('panels').dataset.view);
  await P.select('retiparire-1962');
  P.setView('all');
  stage('impulsuri');
  // capcana IMPULSURI: mașina oprită de la pupitru spune de ce, iar Reîncarcă o repune în funcțiune
  click('switch-pulses-0');
  P.advance(50);
  click('switch-compute-0');
  P.advance(50);
  if (!status.textContent.includes('IMPULSURI')) fail('impulsuri întrerupte, starea: ' + status.textContent);
  if (d.getElementById('switch-compute-0').classList.contains('cue')) fail('marcajul rămâne după apăsare');
  if (d.getElementById('cue-arrow') && d.getElementById('cue-arrow').getAttribute('display') !== 'none') fail('săgeata rămâne după apăsare');
  await P.select('retiparire-1962');
  if (P.runner.pulsesOff || d.getElementById('switch-pulses-0').getAttribute('aria-pressed') !== 'false')
    fail('Reîncarcă nu readuce impulsurile');
  stage('limba');
  // limba: engleza se aplică fără reîncărcare, inscripțiile rămân în română
  P.setLang('en');
  if (d.documentElement.lang !== 'en' || !d.getElementById('hint').textContent.startsWith('Press'))
    fail('engleza: ' + d.getElementById('hint').textContent);
  if (!d.getElementById('switch-compute-0').getAttribute('aria-label').startsWith('CALCULEAZA AUTOMAT ('))
    fail('eticheta în engleză: ' + d.getElementById('switch-compute-0').getAttribute('aria-label'));
  P.setLang('ro');
  if (!d.getElementById('hint').textContent.startsWith('Apăsați')) fail('înapoi la română');
  stage('sunet');
  // butonul de sunet: pornit implicit, comutarea se ține minte, fără erori (Chrome fără ecran nu face niciun gest real)
  const snd = d.getElementById('sound');
  if (!snd || snd.getAttribute('aria-pressed') !== 'true' || !snd.textContent.includes('🔊') || snd.disabled)
    fail('butonul de sunet la pornire: ' + (snd && snd.outerHTML));
  click('sound');
  if (snd.getAttribute('aria-pressed') !== 'false' || !snd.textContent.includes('🔇') || w.localStorage.getItem('mecipt.sound') !== 'off')
    fail('sunetul nu se oprește: ' + snd.outerHTML + ' ' + w.localStorage.getItem('mecipt.sound'));
  P.setLang('en');
  if (!snd.getAttribute('aria-label').startsWith('Sound is off')) fail('eticheta sunetului în engleză: ' + snd.getAttribute('aria-label'));
  P.setLang('ro');
  click('sound');
  if (snd.getAttribute('aria-pressed') !== 'true' || w.localStorage.getItem('mecipt.sound') !== 'on' || P.sound.on !== true)
    fail('sunetul nu repornește');
  if (errors.length) fail('erori după sunet: ' + errors.join(' | '));
  P.setSpeed('rapid');
  click('switch-compute-0');
  await until(() => P.sheet.lines()[0] === '1477  27 oooo  3o oooo' && glow('lamp-indicators-2') > 0.5, 20000,
    () => `retipărirea: mod ${P.runner.mode}, timp ${P.runner.machine.seconds().toFixed(2)} s, coala ${JSON.stringify(P.sheet.lines().slice(0, 2))}, OPRIT ${glow('lamp-indicators-2')}`);
  stage('inex');
  await P.select('inex1');
  click('switch-compute-0');
  // banda INEX-1 reconstruită: 190 de cuvinte × 6 rânduri, încărcate de preîncărcătorul original
  if (!d.getElementById('tape-info').textContent.includes('reconstruită')) fail('banda INEX-1: ' + d.getElementById('tape-info').textContent);
  await until(() => glow('lamp-indicators-1') > 0.5 && P.runner.machine.tapePos() === 1140, 30000,
    () => `INEX: HIRTIA ${glow('lamp-indicators-1')}, banda ${P.runner.machine.tapePos()}, mod ${P.runner.mode}`);
  stage('tambur');
  // tamburul magnetic: desenat după fotografie, se rotește, are ajutor
  const cells = () => [...d.querySelectorAll('#drum .seam')].map((s) => s.getAttribute('x')).join();
  if (!d.querySelector('#drum svg .head-block')) fail('tamburul nu e desenat');
  const c0 = cells(); await new Promise((r) => setTimeout(r, 150)); P.advance(16);
  if (cells() === c0) fail('tamburul nu se rotește: ' + c0);
  // harta tamburului: după banda INEX-1 (190 de cuvinte, 0002–0277) inelul e plin în dreptul lor
  P.advance(300);
  const nMap = Number((d.getElementById('drum-map-legend').textContent.match(/\d+/) || [0])[0]);
  if (nMap < 190) fail('harta tamburului după INEX: ' + d.getElementById('drum-map-legend').textContent);
  const px = d.getElementById('drum-map').getContext('2d').getImageData(0, 0, 320, 320).data;
  let lit = 0; for (let i = 0; i < px.length; i += 4) if (px[i + 3] > 0 && px[i] > 150) lit++;
  if (lit < 500) fail('harta tamburului e goală pe ecran: ' + lit);
  d.getElementById('drum').click();
  if (d.getElementById('help-title').textContent !== helpRO.entries.drum.title) fail('ajutorul tamburului: ' + d.getElementById('help-title').textContent);
  d.getElementById('help-close').click();
  stage('programe');
  // programele reconstruite: eticheta „ilustrativ”, ajutorul programului, coala la „rapid”
  await P.select('vidraru');
  if (!d.getElementById('provenance').textContent.includes('cifrele nu sunt cele reale')) fail('eticheta Vidraru: ' + d.getElementById('provenance').textContent);
  d.getElementById('explain').click();
  d.getElementById('provenance').click();
  if (d.getElementById('help-title').textContent !== helpRO.entries['program-vidraru'].title) fail('ajutorul Vidraru: ' + d.getElementById('help-title').textContent);
  d.getElementById('help-close').click();
  d.getElementById('explain').click();
  click('switch-compute-0');
  await until(() => P.sheet.lines().length >= 11 && glow('lamp-indicators-2') > 0.5, 20000, () => 'Vidraru: ' + JSON.stringify(P.sheet.lines().slice(0, 2)));
  if (!P.sheet.lines()[0].startsWith('834  o,oooooo-')) fail('prima linie Vidraru: ' + P.sheet.lines()[0]);
  await P.select('sinus-1962');
  click('switch-compute-0');
  await until(() => P.sheet.lines().length >= 9 && glow('lamp-indicators-2') > 0.5, 20000, () => 'sinus: ' + JSON.stringify(P.sheet.lines().slice(0, 2)));
  if (P.sheet.lines()[0] !== 'o,o174524o6-o,o34899496-o,o52335954-o,o69756471-o,o87155741-') fail('prima linie a sinusului: ' + P.sheet.lines()[0]);
  stage('atelier-eticheta');
  // eticheta din bară urmează proveniența în orice vedere: MEMORIE SCRIERE de la pupitru face cuvântul MODIFICAT
  await P.select('retiparire-1962');
  P.runner.enqueue({ op: 2, arg: 0o1551 });       // OP.SWITCHES_RAI
  P.runner.enqueue({ op: 9 });                    // OP.MEM_SCRIERE
  P.advance(50); P.advance(50);
  if (!d.getElementById('provenance').textContent.includes('MODIFICAT')) fail('eticheta după MEMORIE SCRIERE în Pupitru: ' + d.getElementById('provenance').textContent);
  stage('atelier');
  // Atelierul: vederea, editorul, tamburul, proveniența MODIFICAT, revenirea la original, banda prin INEX-1
  const m = P.runner.machine;
  await P.select('retiparire-1962');
  P.setMode('atelier');
  P.advance(50);
  const vis = (id) => { const e = d.getElementById(id); return e && e.offsetParent !== null; };
  if (!vis('atelier') || vis('panel-left') || !vis('panel-right')) fail('vederea Atelier: ' + [vis('atelier'), vis('panel-left'), vis('panel-right')]);
  if (d.documentElement.scrollWidth > w.innerWidth + 1) fail('Atelierul cere derulare orizontală: ' + d.documentElement.scrollWidth);
  const row = (a) => d.querySelector(`#atelier li[data-addr="${a}"]`);
  const type = async (a, text) => {
    if (!row(a)) fail('lipsește rândul ' + a.toString(8) + ' din editor; rânduri: ' + d.querySelectorAll('#atelier li[data-addr]').length);
    row(a).click();
    const inp = row(a).querySelector('.ed-input');
    if (!inp) fail('rândul ' + a.toString(8) + ' nu se deschide pentru editare');
    inp.value = text;
    inp.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
    P.advance(50); P.advance(50);
  };
  await type(0o1551, '= 0,25');
  if (m.peek(0o1551) !== 0x10000000) fail('editorul nu scrie pe tambur: ' + m.peek(0o1551).toString(8));
  if (!row(0o1551).textContent.includes('MODIFICAT')) fail('rândul nu arată MODIFICAT: ' + row(0o1551).textContent);
  if (!d.querySelector('#atelier .cell[data-addr="873"]').getAttribute('class').includes('kind-MODIFICAT')) fail('celula 1551 nu e MODIFICAT');
  if (!d.getElementById('provenance').textContent.includes('MODIFICAT')) fail('eticheta din bară: ' + d.getElementById('provenance').textContent);
  row(0o1551).click();
  const inp2 = row(0o1551).querySelector('.ed-input');
  inp2.value = '= 2,5';
  inp2.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  const err = row(0o1551).querySelector('.row-error');
  if (!err || err.hidden) fail('textul greșit nu arată eroare');
  if (m.peek(0o1551) !== 0x10000000) fail('textul greșit a schimbat tamburul');
  row(0o1551).querySelector('.ed-cancel').click();
  d.querySelector('#atelier .ed-revert').click();
  await until(() => m.provenance(0o1551).kind === 'RECONSTRUCTIE', 5000, 'Revino la original: ' + m.provenance(0o1551).kind);
  if (w.localStorage.getItem('mecipt.atelier.retiparire-1962') !== null) fail('modificările rămân în localStorage după revenire');
  // ștergerea unui cuvânt original se vede în eticheta din bară
  row(0o1500).click();
  row(0o1500).querySelector('.ed-remove').click();
  P.advance(50); P.advance(50);
  if (!/șters/.test(d.getElementById('provenance').textContent)) fail('ștergerea nu apare în etichetă: ' + d.getElementById('provenance').textContent);
  d.querySelector('#atelier .ed-revert').click();
  await until(() => m.provenance(0o1500).kind === 'ORIGINAL', 5000, 'revenire după ștergere');
  // tastatura: Enter pe un rând îl deschide; după scriere, focusul revine pe rând
  P.advance(50);
  row(0o1556).focus();
  row(0o1556).dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  const kin = row(0o1556).querySelector('.ed-input');
  if (!kin) fail('Enter pe rând nu deschide editarea');
  kin.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  if (d.activeElement !== row(0o1556)) fail('focusul nu revine pe rând: ' + (d.activeElement && d.activeElement.tagName));
  // rândurile nu se reconstruiesc cât rulează mașina (click-urile nu se pierd)
  const keep = row(0o1477);
  d.getElementById('at-run').click();
  for (let i = 0; i < 12; i++) P.advance(50);
  if (row(0o1477) !== keep) fail('editorul își reconstruiește rândurile cât rulează');
  d.getElementById('at-stop').click(); P.advance(50);
  d.querySelector('#atelier .ed-revert').click();
  await until(() => !m.written(0o1512), 5000, 'revenire după rulare');
  // banda perforată de vizitator, încărcată cu preîncărcătorul original INEX-1
  const pu = (c) => d.querySelector('#atelier ' + c);
  pu('.pu-text').value = 'UI 0000  CU 0000\n= 0,25\n05 1626  25 1512';
  pu('.pu-punch').click();
  pu('.pu-load').click();
  pu('.pu-inex').click();
  await until(() => m.provenance(0o10).kind === 'ORIGINAL' && row(0o14), 5000, 'INEX-1 nu ajunge pe tambur');
  if (!d.getElementById('tape-info').textContent.includes(P.runner.machine && 'vizitator')) fail('eticheta benzii: ' + d.getElementById('tape-info').textContent);
  await type(0o14, '25 1000  01 0001');
  if (!pu('.pu-where').textContent.includes('1000') || pu('.pu-where').classList.contains('pu-danger')) fail('planul INEX: ' + pu('.pu-where').textContent);
  const start = d.getElementById('at-start');
  start.value = '0010';
  start.dispatchEvent(new w.Event('change', { bubbles: true }));
  d.getElementById('at-run').click();
  await until(() => glow('lamp-indicators-1') > 0.5, 15000, 'banda nu se termină (HIRTIA): ' + m.tapePos());
  P.advance(50); P.advance(300);
  const nMod = [...Array(1024).keys()].filter((a) => m.provenance(a).kind === 'MODIFICAT').length;
  if (!d.getElementById('provenance').textContent.includes(String(nMod))) fail(`eticheta după INEX: ${nMod} MODIFICAT, bara: ` + d.getElementById('provenance').textContent);
  const want = ['UI 0000  CU 0000', '= 0,25', '05 1626  25 1512'].map((t) => m.assemble(t).word);
  for (let i = 0; i < 3; i++) {
    if (m.peek(0o1000 + i) !== want[i] || m.provenance(0o1000 + i).kind !== 'MODIFICAT') fail(`INEX: cuvântul ${i} la ${(0o1000 + i).toString(8)}`);
  }
  // pupitrul încarcă originalul, chiar dacă există modificări salvate
  await P.select('retiparire-1962');
  await type(0o1551, '= 0,25');
  P.setMode('console');
  P.advance(50);
  if (vis('atelier')) fail('Atelierul rămâne vizibil în vederea Pupitru');
  await P.select('retiparire-1962');
  if (m.provenanceSummary().some((e) => e.kind === 'MODIFICAT')) fail('pupitrul a încărcat versiunea modificată');
  P.setMode('atelier'); P.advance(50);
  if (m.provenance(0o1551).kind !== 'MODIFICAT' || !d.getElementById('at-modified') || d.getElementById('at-modified').hidden) fail('Atelierul nu oferă versiunea modificată');
  d.querySelector('#atelier .ed-revert').click();
  await until(() => m.provenance(0o1551).kind === 'RECONSTRUCTIE', 5000, 'a doua revenire');
  // „Explică” pe o celulă de tambur: explicația Atelierului, cu adresa și cuvântul
  P.explainMode(true);
  d.querySelector('#atelier .cell[data-addr="873"]').dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
  P.advance(50);
  if (d.getElementById('help-title').textContent !== helpRO.entries['atelier-cell'].title) fail('Explică pe celula de tambur: ' + d.getElementById('help-title').textContent);
  if (!d.getElementById('help-value').textContent.includes('1551')) fail('valoarea celulei: ' + d.getElementById('help-value').textContent);
  const nBefore = m.instructions();
  d.getElementById('at-step').click();
  P.advance(50);
  if (m.instructions() !== nBefore) fail('în modul Explică, „Pas” a executat o instrucțiune');
  if (d.getElementById('help-title').textContent !== helpRO.entries['atelier-controls'].title) fail('Explică pe Pas: ' + d.getElementById('help-title').textContent);
  P.explainMode(false); P.closeHelp();
  P.setMode('console'); P.advance(50);
  stage('3d');
  // vederea 3D: butonul comută; modelul se încarcă la cerere; becurile se aprind după emulator; înapoi la 2D.
  // Fără WebGL (unele mașini fără ecran), pagina trebuie să spună asta și să rămână în 2D.
  await P.select('retiparire-1962');
  click('view-3d');
  await until(() => P.view3dState() !== 'loading', 20000, 'modelul 3D nu se încarcă');
  if (P.view3dState() === 'ready') {
    if (!d.querySelector('#desk-3d canvas')) fail('3D: lipsește desenul');
    if (!d.querySelector('.frame').closest('[hidden]') && d.querySelector('.frame').offsetParent !== null) fail('3D: pupitrul 2D încă se vede');
    if (P.view3d().lampCount !== 161) fail('3D: becuri legate ' + P.view3d().lampCount);
    if (d.getElementById('view-3d').getAttribute('aria-pressed') !== 'true') fail('3D: butonul nu arată starea');
    if (P.view3d().switchCount !== 63) fail('3D: comutatoare legate ' + P.view3d().switchCount);
    if (!d.getElementById('cue3d').hidden) fail('3D: săgeata de pornire rămâne după ce CALCULEAZA a fost apăsat');
    // un clic de mouse pe maneta CALCULEAZĂ din model pornește mașina, ca în 2D; o tragere doar rotește
    P.advance(50);
    const cv = d.querySelector('#desk-3d canvas'), sc = P.view3d().screenOf('switch-compute-0');
    if (!sc || P.view3d().pickAt(sc.x, sc.y) !== 'switch-compute-0') fail('3D: maneta CALCULEAZĂ nu se nimerește: ' + JSON.stringify(sc));
    const ptr = (type, dx = 0) => cv.dispatchEvent(new w.PointerEvent(type, { bubbles: true, clientX: sc.x + dx, clientY: sc.y,
      pointerId: 1, pointerType: 'mouse', isPrimary: true, button: 0, buttons: type === 'pointerup' ? 0 : 1 }));
    const nDrag = m.instructions();
    ptr('pointerdown'); ptr('pointerup', 40);                 // tragere: nu apasă nimic
    if (d.getElementById('switch-compute-0').classList.contains('up')) fail('3D: o tragere a ridicat CALCULEAZĂ');
    P.advance(200);
    if (m.instructions() !== nDrag) fail('3D: o tragere a apăsat CALCULEAZĂ');
    ptr('pointerdown'); ptr('pointerup');
    if (!d.getElementById('switch-compute-0').classList.contains('up')) fail('3D: clicul pe manetă nu apasă comutatorul');
    await until(() => P.view3d().lit() > 5, 20000, () => '3D: becurile nu se aprind: ' + P.view3d().lit());
    await until(() => m.instructions() > nDrag, 20000, '3D: clicul pe CALCULEAZĂ nu a pornit mașina');
    // zonele camerei: „Registrul M” aduce rândul M aproape (lat pe ecran); „Tot pupitrul” îl duce înapoi
    if (d.getElementById('zones3d').hidden || d.querySelectorAll('#zones3d button').length !== 8) fail('3D: lipsesc butoanele zonelor');
    const spanM = () => { const a = P.view3d().screenOf('switch-M-0'), b = P.view3d().screenOf('switch-M-30'); return Math.hypot(b.x - a.x, b.y - a.y); };
    const wAll = spanM();
    click('zone3d-M');
    for (let k = 0; k < 25; k++) { P.advance(50); await sleep(50); }
    const cvw = cv.getBoundingClientRect().width;
    if (d.getElementById('zone3d-M').getAttribute('aria-pressed') !== 'true') fail('3D: butonul zonei M nu arată starea');
    if (!(spanM() > 0.6 * cvw && spanM() < cvw)) fail(`3D: zona M nu încape bine pe ecran: ${spanM().toFixed(0)} din ${cvw.toFixed(0)} (înainte ${wAll.toFixed(0)})`);
    const sM = P.view3d().screenOf('switch-M-15');
    if (P.view3d().pickAt(sM.x, sM.y) !== 'switch-M-15') fail('3D: în zona M, maneta 15 nu se nimerește');
    click('zone3d-all');
    for (let k = 0; k < 25; k++) { P.advance(50); await sleep(50); }
    if (Math.abs(spanM() - wAll) > 2) fail('3D: „Tot pupitrul” nu revine: ' + spanM().toFixed(0) + ' față de ' + wAll.toFixed(0));
    P.runner.enqueue({ op: 13 });                   // OP.OPRESTE
    P.advance(50);
  } else if (P.view3dState() === 'unavailable') {
    if (!d.getElementById('desk-3d-msg').textContent.includes('3D')) fail('3D indisponibil fără mesaj');
  } else fail('3D: stare ' + P.view3dState());
  click('view-3d');
  if (d.querySelector('.frame').offsetParent === null) fail('înapoi la 2D: pupitrul nu se vede');
  P.explainMode(true);
  click('view-3d');
  if (d.getElementById('help-title').textContent !== helpRO.entries.view3d.title) fail('Explică pe 3D: ' + d.getElementById('help-title').textContent);
  if (d.querySelector('.frame').offsetParent === null) fail('în modul Explică, butonul 3D a comutat vederea');
  P.explainMode(false); P.closeHelp();
  stage('telefon');
  // telefonul (390 px): fără derulare orizontală a paginii, un singur panou (cel drept), comutatoare de atins cu degetul
  const openAt = async (width, height, search = '') => {
    const h = document.createElement('iframe');
    h.width = width; h.height = height;
    document.body.append(h);
    h.src = '../index.html' + search;
    await until(() => h.contentWindow && h.contentWindow.__pupitru, 10000, 'pagina nu se încarcă la ' + width + ' px');
    await h.contentWindow.__pupitru.ready;
    h.contentWindow.__pupitru.advance(50);
    return h;
  };
  const wide = (h) => h.contentDocument.documentElement.scrollWidth - h.contentDocument.documentElement.clientWidth;
  const ph = await openAt(390, 800);
  if (wide(ph) > 0) fail('pe telefon pagina derulează orizontal cu ' + wide(ph) + ' px');
  if (ph.contentDocument.getElementById('panels').dataset.view !== 'right') fail('pe telefon: vederea ' + ph.contentDocument.getElementById('panels').dataset.view);
  const lever = ph.contentDocument.getElementById('switch-compute-0').getBoundingClientRect();
  if (Math.min(lever.width, lever.height) < 20) fail('comutatorul CALCULEAZA e prea mic pe telefon: ' + lever.width.toFixed(0) + '×' + lever.height.toFixed(0));
  // butonul de pornire (marcat de îndrumare) se vede în rama panoului, fără derulare
  const pd = ph.contentDocument, phFrame = pd.querySelector('.frame').getBoundingClientRect();
  const cue = pd.getElementById('switch-compute-0').getBoundingClientRect();
  if (cue.left < phFrame.left || cue.right > phFrame.right) fail(`pe telefon, CALCULEAZA nu se vede în ramă: ${cue.left.toFixed(0)}–${cue.right.toFixed(0)} în ${phFrame.left.toFixed(0)}–${phFrame.right.toFixed(0)}`);
  // mașina de scris înaintea tamburului; rândurile lungi (60 de caractere la sinus) se derulează pe coală
  if (pd.querySelector('.typewriter').getBoundingClientRect().top > pd.querySelector('.drum-device').getBoundingClientRect().top) fail('pe telefon, mașina de scris vine după tambur');
  if (ph.contentWindow.getComputedStyle(pd.querySelector('.sheet-paper')).overflowX !== 'auto') fail('pe telefon, coala nu se derulează orizontal');
  // filele de jos: fixe la marginea ecranului, câte una pentru fiecare parte; o atingere duce la partea ei
  const tabs = pd.getElementById('phone-tabs');
  if (!tabs || ph.contentWindow.getComputedStyle(tabs).display === 'none') fail('pe telefon lipsesc filele de jos');
  const tb = tabs.getBoundingClientRect();
  if (Math.abs(tb.bottom - 800) > 2 || tb.height < 44) fail(`filele de jos nu stau jos: ${tb.top.toFixed(0)}–${tb.bottom.toFixed(0)}`);
  if (tabs.querySelectorAll('button').length !== 5) fail('filele de jos: ' + tabs.querySelectorAll('button').length);
  for (const b of tabs.querySelectorAll('button')) if (b.getBoundingClientRect().height < 44) fail('fila prea mică: ' + b.textContent);
  pd.getElementById('tab-drum').click();
  // tamburul vine ultimul: ajunge sus sau, la capătul paginii, se vede întreg deasupra filelor
  const atEnd = () => ph.contentWindow.scrollY + ph.contentWindow.innerHeight >= pd.documentElement.scrollHeight - 2;
  const dr = () => pd.querySelector('.drum-device').getBoundingClientRect();
  await until(() => Math.abs(dr().top) < 30 || (atEnd() && dr().top >= 0 && dr().bottom <= tb.top), 5000,
    () => 'fila Tambur nu duce la tambur: ' + pd.querySelector('.drum-device').getBoundingClientRect().top.toFixed(0));
  await until(() => pd.getElementById('tab-drum').getAttribute('aria-current') === 'true', 3000, 'fila Tambur nu se marchează');
  pd.getElementById('tab-atelier').click();
  await until(() => ph.contentDocument.body.dataset.mode === 'atelier' && Math.abs(pd.getElementById('atelier').getBoundingClientRect().top) < 30, 5000, 'fila Atelier');
  pd.getElementById('tab-desk').click();
  await until(() => ph.contentDocument.body.dataset.mode === 'console' && pd.getElementById('desk').getBoundingClientRect().top > -30, 5000, 'fila Pupitru');
  // ultimul rând al paginii nu rămâne sub file
  ph.contentWindow.scrollTo(0, 1e6); ph.contentWindow.__pupitru.advance(50);
  if (pd.querySelector('.credits').getBoundingClientRect().bottom > tb.top + 1) fail('subsolul rămâne sub filele de jos');
  ph.contentWindow.scrollTo(0, 0);
  ph.contentWindow.__pupitru.setMode('atelier'); ph.contentWindow.__pupitru.advance(50);
  if (wide(ph) > 0) fail('pe telefon, Atelierul derulează orizontal cu ' + wide(ph) + ' px');
  ph.contentWindow.__pupitru.setMode('console');
  ph.remove();
  stage('lat-1280');
  const mid = await openAt(1280, 900);
  for (const m of ['console', 'both', 'atelier']) {
    mid.contentWindow.__pupitru.setMode(m); mid.contentWindow.__pupitru.advance(50);
    if (wide(mid) > 0) fail(`la 1280 px, vederea ${m} derulează orizontal cu ${wide(mid)} px`);
  }
  mid.contentWindow.__pupitru.setMode('console');
  if (mid.contentWindow.getComputedStyle(mid.contentDocument.getElementById('phone-tabs')).display !== 'none') fail('la 1280 px se văd filele de telefon');
  mid.remove();
  stage('documentatie');
  if (!d.getElementById('doc-link').getAttribute('href').startsWith('doc.html')) fail('linkul spre documentație');
  if (d.getElementById('doc-link').target !== '_blank') fail('documentația trebuie să se deschidă într-un tab nou (pupitrul rămâne pe loc)');
  const g = document.createElement('iframe');
  g.width = 1200; g.height = 800;
  document.body.append(g);
  const docText = () => (g.contentDocument && g.contentDocument.getElementById('doc-content') || {}).innerHTML || '';
  g.src = '../doc.html?lang=ro#05-banda-si-masina-de-scris';
  await until(() => docText().includes('perforația') && docText().includes('<table>'), 10000, () => 'capitolul 05: ' + docText().slice(0, 120));
  if (!docText().includes('10101')) fail('exemplul de bandă lipsește');
  g.src = '../doc.html?lang=en#05-banda-si-masina-de-scris';
  await until(() => docText().includes('punched'), 10000, () => 'capitolul 05 în engleză: ' + docText().slice(0, 120));
  g.src = '../doc.html?lang=ro#semantica';
  await until(() => docText().includes('Pupitrul web'), 10000, () => 'semantica: ' + docText().slice(0, 120));
  if (errors.length) fail('erori în pagină: ' + errors.join(' | '));
  out.textContent = 'SMOKE OK';
})().catch((e) => { if (!out.textContent.startsWith('SMOKE FAIL')) out.textContent = 'SMOKE FAIL: ' + e; });
</script>
</html>
